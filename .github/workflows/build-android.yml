
name: Build OCR Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Check project files
        working-directory: OCR-Text
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f app.js
          test -f index.html
          test -f assets/favicon/OCR.png
          test -f scripts/build-web.mjs
          test -f scripts/prepare-android-assets.mjs

      - name: Install dependencies
        working-directory: OCR-Text
        run: npm install

      - name: Configure app identity and version
        working-directory: OCR-Text
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const configFile = 'capacitor.config.json';
          const config = JSON.parse(
            fs.readFileSync(configFile, 'utf8')
          );

          config.appId = 'ir.hosseinsaghafi.ocr';
          config.appName = 'استخراج متن';
          config.webDir = 'www';

          fs.writeFileSync(
            configFile,
            JSON.stringify(config, null, 2) + '\n'
          );

          const manifestFile = 'manifest.webmanifest';
          const manifest = JSON.parse(
            fs.readFileSync(manifestFile, 'utf8')
          );

          manifest.name = 'استخراج متن';
          manifest.short_name = 'استخراج متن';

          fs.writeFileSync(
            manifestFile,
            JSON.stringify(manifest, null, 2) + '\n'
          );

          let html = fs.readFileSync('index.html', 'utf8');

          html = html.replace(
            /<title>[\s\S]*?<\/title>/i,
            '<title>استخراج متن</title>'
          );

          fs.writeFileSync('index.html', html);

          console.log('App name: استخراج متن');
          console.log('App ID: ir.hosseinsaghafi.ocr');
          NODE

      - name: Bundle OCR engine and language models
        working-directory: OCR-Text
        run: node scripts/prepare-android-assets.mjs

      - name: Verify bundled OCR resources
        working-directory: OCR-Text
        run: |
          test -s assets/ocr-runtime/tesseract.min.js
          test -s assets/ocr-runtime/worker.min.js

          test -s assets/ocr-runtime/core/tesseract-core-simd-lstm.wasm
          test -s assets/ocr-runtime/core/tesseract-core-simd-lstm.wasm.js
          test -s assets/ocr-runtime/core/tesseract-core-lstm.wasm
          test -s assets/ocr-runtime/core/tesseract-core-lstm.wasm.js

          test -s assets/ocr-runtime/lang/fas.traineddata.gz
          test -s assets/ocr-runtime/lang/eng.traineddata.gz

          echo "All OCR engine files and language models are ready."

      - name: Stage web application
        working-directory: OCR-Text
        run: node scripts/build-web.mjs

      - name: Prepare app icon from OCR.png
        working-directory: OCR-Text
        run: |
          convert assets/favicon/OCR.png \
            -filter Lanczos \
            -resize 1024x1024 \
            -gravity center \
            -background none \
            -extent 1024x1024 \
            assets/icon.png

          identify assets/icon.png

      - name: Generate Android project
        working-directory: OCR-Text
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: OCR-Text
        run: npx cap sync android

      - name: Generate Android icons
        working-directory: OCR-Text
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#171a22' \
            --iconBackgroundColorDark '#171a22' \
            --splashBackgroundColor '#171a22' \
            --splashBackgroundColorDark '#171a22'

      - name: Configure Android app and Release signing
        working-directory: OCR-Text
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function findBlock(source, name, from = 0, limit = source.length) {
            const regex = new RegExp(`\\b${name}\\s*\\{`, 'g');
            regex.lastIndex = from;

            const match = regex.exec(source);

            if (!match || match.index >= limit) return null;

            const open = source.indexOf('{', match.index);
            let depth = 0;

            for (let i = open; i < limit; i++) {
              if (source[i] === '{') depth++;

              else if (source[i] === '}') {
                depth--;

                if (depth === 0) {
                  return {
                    start: match.index,
                    open,
                    close: i
                  };
                }
              }
            }

            throw new Error(`Unclosed Gradle block: ${name}`);
          }

          function replaceBlockBody(source, block, body) {
            const lineStart = source.lastIndexOf('\n', block.close - 1) + 1;
            const closeIndent = source.slice(lineStart, block.close);

            return source.slice(0, block.open + 1) +
              body.replace(/\s+$/, '') +
              '\n' + closeIndent +
              source.slice(block.close);
          }

          function setProperty(body, name, value, indent = '        ') {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const regex = new RegExp(
              `^([\\t ]*)${escaped}\\s*(?:=\\s*)?.*$`,
              'm'
            );

            if (regex.test(body)) {
              return body.replace(
                regex,
                (_line, currentIndent) =>
                  `${currentIndent}${name} ${value}`
              );
            }

            return `${body.replace(/\s+$/, '')}\n${indent}${name} ${value}\n`;
          }

          function insertBeforeBlock(source, block, content) {
            const lineStart = source.lastIndexOf('\n', block.start - 1) + 1;

            return source.slice(0, lineStart) +
              content +
              source.slice(lineStart);
          }

          const gradleFile = 'android/app/build.gradle';

          if (!fs.existsSync(gradleFile)) {
            throw new Error('Android Gradle file not found.');
          }

          let gradle = fs.readFileSync(gradleFile, 'utf8');

          let androidBlock = findBlock(gradle, 'android');

          if (!androidBlock) {
            throw new Error('Android Gradle block not found.');
          }

          let androidBody = gradle.slice(
            androidBlock.open + 1,
            androidBlock.close
          );

          androidBody = setProperty(
            androidBody,
            'namespace',
            '"ir.hosseinsaghafi.ocr"',
            '    '
          );

          gradle = replaceBlockBody(
            gradle,
            androidBlock,
            androidBody
          );

          let defaultConfig = findBlock(gradle, 'defaultConfig');

          if (!defaultConfig) {
            throw new Error('defaultConfig block not found.');
          }

          let defaultBody = gradle.slice(
            defaultConfig.open + 1,
            defaultConfig.close
          );

          defaultBody = setProperty(
            defaultBody,
            'applicationId',
            '"ir.hosseinsaghafi.ocr"'
          );

          defaultBody = setProperty(defaultBody, 'versionCode', '1');
          defaultBody = setProperty(
            defaultBody,
            'versionName',
            '"1.0"'
          );

          gradle = replaceBlockBody(
            gradle,
            defaultConfig,
            defaultBody
          );

          androidBlock = findBlock(gradle, 'android');

          const signingBlock = findBlock(
            gradle,
            'signingConfigs',
            androidBlock.open + 1,
            androidBlock.close
          );

          const signingBody = `
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              `;

          if (signingBlock) {
            gradle = replaceBlockBody(
              gradle,
              signingBlock,
              signingBody
            );
          } else {
            const buildTypes = findBlock(
              gradle,
              'buildTypes',
              androidBlock.open + 1,
              androidBlock.close
            );

            const insertion = `    signingConfigs {${signingBody}\n    }\n\n`;

            if (buildTypes) {
              gradle = insertBeforeBlock(
                gradle,
                buildTypes,
                insertion
              );
            } else {
              gradle = insertBeforeBlock(
                gradle,
                androidBlock,
                insertion
              );
            }
          }

          androidBlock = findBlock(gradle, 'android');

          const buildTypes = findBlock(
            gradle,
            'buildTypes',
            androidBlock.open + 1,
            androidBlock.close
          );

          if (!buildTypes) {
            gradle = insertBeforeBlock(
              gradle,
              androidBlock,
              `    buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }\n`
            );
          } else {
            const releaseBlock = findBlock(
              gradle,
              'release',
              buildTypes.open + 1,
              buildTypes.close
            );

            if (!releaseBlock) {
              gradle = insertBeforeBlock(
                gradle,
                buildTypes,
                `        release {
                      signingConfig signingConfigs.release
                  }\n`
              );
            } else {
              const releaseBody = gradle.slice(
                releaseBlock.open + 1,
                releaseBlock.close
              );

              gradle = replaceBlockBody(
                gradle,
                releaseBlock,
                setProperty(
                  releaseBody,
                  'signingConfig',
                  'signingConfigs.release',
                  '            '
                )
              );
            }
          }

          fs.writeFileSync(gradleFile, gradle);

          const stringsFile =
            'android/app/src/main/res/values/strings.xml';

          let strings = fs.readFileSync(stringsFile, 'utf8');

          const appNamePattern =
            /(<string\s+name="app_name"[^>]*>)[\s\S]*?(<\/string>)/;

          if (appNamePattern.test(strings)) {
            strings = strings.replace(
              appNamePattern,
              '$1استخراج متن$2'
            );
          } else {
            strings = strings.replace(
              '</resources>',
              '    <string name="app_name">استخراج متن</string>\n</resources>'
            );
          }

          fs.writeFileSync(stringsFile, strings);

          console.log('App name: استخراج متن');
          console.log('Application ID: ir.hosseinsaghafi.ocr');
          console.log('Version Code: 1');
          console.log('Version Name: 1.0');
          console.log('Release signing configured.');
          NODE

      - name: Restore Release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/ocr-release.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > /dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Release signing key restored and verified."

      - name: Build signed Release APK
        working-directory: OCR-Text/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ocr-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        working-directory: OCR-Text/android
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -s "$APK"

          APKSIGNER="$(find "$SDK/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "Signed Release APK verified successfully."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OCR-Text-v1.0-Release
          path: OCR-Text/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
