
name: Initialize Android Release Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-signing:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Python libraries
        run: python -m pip install --quiet PyNaCl requests

      - name: Generate and securely store signing key
        env:
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import os
          import base64
          import secrets
          import subprocess
          import tempfile
          import requests

          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          token = os.environ["GH_SECRETS_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]

          if not token:
              raise SystemExit("Missing setup token.")

          api = f"https://api.github.com/repos/{repo}/actions/secrets"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          session = requests.Session()
          session.headers.update(headers)

          response = session.get(
              api,
              params={"per_page": 100},
              timeout=30
          )
          response.raise_for_status()

          existing = {
              item["name"]
              for item in response.json().get("secrets", [])
          }

          names = {
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD"
          }

          found = names.intersection(existing)

          if found:
              raise SystemExit(
                  "Signing secrets already exist. "
                  "No key was generated or overwritten."
              )

          store_password = secrets.token_urlsafe(32)
          key_password = secrets.token_urlsafe(32)
          alias = "ocr-release"

          with tempfile.TemporaryDirectory() as folder:
              keystore = Path(folder) / "OCR-Release.jks"

              subprocess.run(
                  [
                      "keytool", "-genkeypair", "-v",
                      "-keystore", str(keystore),
                      "-storetype", "JKS",
                      "-storepass", store_password,
                      "-keypass", key_password,
                      "-alias", alias,
                      "-keyalg", "RSA",
                      "-keysize", "2048",
                      "-validity", "10000",
                      "-dname",
                      "CN=OCR Text, OU=Android, O=OCR Text, C=US",
                      "-noprompt"
                  ],
                  check=True,
                  capture_output=True,
                  text=True
              )

              subprocess.run(
                  [
                      "keytool", "-list",
                      "-keystore", str(keystore),
                      "-storepass", store_password,
                      "-alias", alias
                  ],
                  check=True,
                  capture_output=True,
                  text=True
              )

              keystore_base64 = base64.b64encode(
                  keystore.read_bytes()
              ).decode("ascii")

          response = session.get(
              api + "/public-key",
              timeout=30
          )
          response.raise_for_status()

          public_data = response.json()

          public_key = PublicKey(
              base64.b64decode(public_data["key"])
          )

          sealed_box = SealedBox(public_key)

          values = {
              "ANDROID_KEYSTORE_BASE64": keystore_base64,
              "ANDROID_KEYSTORE_PASSWORD": store_password,
              "ANDROID_KEY_ALIAS": alias,
              "ANDROID_KEY_PASSWORD": key_password
          }

          for name, value in values.items():
              encrypted = base64.b64encode(
                  sealed_box.encrypt(value.encode("utf-8"))
              ).decode("ascii")

              response = session.put(
                  f"{api}/{name}",
                  json={
                      "encrypted_value": encrypted,
                      "key_id": public_data["key_id"]
                  },
                  timeout=30
              )

              if response.status_code not in (201, 204):
                  raise SystemExit(
                      f"Could not save secret: {name}. "
                      f"HTTP {response.status_code}"
                  )

              print(f"Successfully stored: {name}")

          print("Release signing key created successfully.")
          PY
